<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#111116" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="logoBg" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.1" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />
  <rect width="1200" height="360" rx="16" fill="url(#ambientGlow)" />
  <rect width="1200" height="360" rx="16" stroke="url(#borderGrad)" stroke-width="1.5" fill="none" />

  <!-- Badge Pill -->
  <g transform="translate(500, 48)">
    <rect width="200" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="30" y="18" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">PROJECT INTELLIGENCE</text>
  </g>

  <!-- Central Brand Icon & Text -->
  <g transform="translate(600, 155)">
    <!-- Brand Icon -->
    <g transform="translate(-230, -38)">
      <rect width="72" height="72" rx="18" fill="url(#logoBg)" stroke="#3f3f46" stroke-width="1.5" />
      <!-- Stylized Radar / Issue Flow Geometry -->
      <path d="M 22 48 L 36 24 L 50 48" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="36" cy="24" r="3.5" fill="#3b82f6" />
      <circle cx="22" cy="48" r="3.5" fill="#10b981" />
      <circle cx="50" cy="48" r="3.5" fill="#3b82f6" />
      <path d="M 29 36 L 43 36" stroke="#e4e4e7" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Title -->
    <text x="-140" y="8" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">TrackFlow</text>

    <!-- Subtitle / Tagline -->
    <text x="-140" y="38" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="-0.2">
      Issue Tracking &amp; Engineering Delivery Intelligence
    </text>
  </g>

  <!-- Descriptive Value Line -->
  <text x="600" y="245" text-anchor="middle" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    Full-stack engineering workspace pairing lightweight Kanban issue management with automated delivery analytics.
  </text>

  <!-- Technology Badges Row -->
  <g transform="translate(600, 290)">
    <!-- React 19 -->
    <g transform="translate(-320, 0)">
      <rect width="95" height="26" rx="6" fill="#18181b" stroke="#27272a" />
      <text x="47.5" y="17" text-anchor="middle" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="600">React 19</text>
    </g>
    <!-- Node / Express 5 -->
    <g transform="translate(-215, 0)">
      <rect width="115" height="26" rx="6" fill="#18181b" stroke="#27272a" />
      <text x="57.5" y="17" text-anchor="middle" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="600">Express 5</text>
    </g>
    <!-- PostgreSQL / Neon -->
    <g transform="translate(-90, 0)">
      <rect width="115" height="26" rx="6" fill="#18181b" stroke="#27272a" />
      <text x="57.5" y="17" text-anchor="middle" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="600">PostgreSQL</text>
    </g>
    <!-- Prisma ORM -->
    <g transform="translate(35, 0)">
      <rect width="105" height="26" rx="6" fill="#18181b" stroke="#27272a" />
      <text x="52.5" y="17" text-anchor="middle" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="600">Prisma ORM</text>
    </g>
    <!-- Azure Cloud -->
    <g transform="translate(150, 0)">
      <rect width="115" height="26" rx="6" fill="#18181b" stroke="#27272a" />
      <text x="57.5" y="17" text-anchor="middle" fill="#e4e4e7" font-family="monospace" font-size="11" font-weight="600">Azure Linux</text>
    </g>
    <!-- Zero Trust RBAC -->
    <g transform="translate(275, 0)">
      <rect width="105" height="26" rx="6" fill="#18181b" stroke="#27272a" />
      <text x="52.5" y="17" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11" font-weight="600">RBAC Secure</text>
    </g>
  </g>
</svg>
